<!DOCTYPE html>
<html class="light" lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>YNA</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      "surface-container-highest":"#e8e0e7","on-surface-variant":"#4d444c","background":"#fff7fc",
      "secondary":"#74537a","primary-container":"#5d3263","secondary-container":"#facffd",
      "on-secondary-container":"#77557c","on-primary":"#ffffff","surface-container-lowest":"#ffffff",
      "surface-container-low":"#faf1f8","primary":"#441b4b","outline":"#7f747d",
      "surface-container":"#f4ebf2","on-primary-container":"#d39dd6","outline-variant":"#d0c3cd",
      "surface":"#fff7fc"
    },
    spacing: { "margin-mobile":"16px","margin-desktop":"48px",base:"8px" },
    fontFamily: { "headline-md":["Plus Jakarta Sans"],"label-sm":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"body-lg":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"] },
    fontSize: {
      "headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],
      "label-sm":["12px",{lineHeight:"16px",fontWeight:"500"}],
      "body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],
      "body-lg":["18px",{lineHeight:"28px",fontWeight:"400"}],
      "label-md":["14px",{lineHeight:"20px",letterSpacing:"0.01em",fontWeight:"600"}]
    }
  }}
}
</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.glass-card{background:rgba(255,247,252,0.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tonal-shadow{box-shadow:0 10px 25px -8px rgba(68,27,75,0.12)}
.nav-active{background-color:#facffd;color:#77557c}
</style>
</head>
<body class="bg-background text-on-background min-h-screen pb-32">

<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile md:px-margin-desktop py-base bg-surface shadow-sm h-16">
  <div class="flex items-center gap-2">
    <div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
      <img alt="YNA Purple Logo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAzhyl8iL7-4icaWXZt3LtAm3M57sWeV6G0rI1Tq62DSYRSdjyY_QjuoO04EO7yBKb7-tMq_lPLwkqEGZcYo3AosKlQlPQ7QhfqouFXytQ2u98F8GmVWJKr5I7j6mFdhtIdltf9jA7jho20mX0BiW6-eoDutEC7aG4Jb5_y9iM2UNNwWex2SSMUGOGPJPEhzCpy8f9ogMxa3xdNsHLclFX1dkqC_s3luBM5QBk8hQZDb3T-C58CrXG0CyRBTYrhTYYV2LxV7M7SoRJ7Pg">
    </div>
    <h1 class="font-headline-md text-headline-md font-bold text-primary">YNA</h1>
  </div>
  <button class="text-on-surface-variant hover:bg-surface-container-high transition-colors p-2 rounded-full active:opacity-80 active:scale-95">
    <span class="material-symbols-outlined text-2xl">settings_accessibility</span>
  </button>
</header>

<main class="mt-20 px-4 max-w-screen-xl mx-auto">
  <section class="space-y-4">
    <h3 class="text-label-md font-bold text-outline uppercase tracking-widest px-1">Medicamentos Ativos</h3>

    <!-- Estado vazio: paciente recém-cadastrado, ainda sem medicamentos -->
    <div class="glass-card rounded-3xl p-10 tonal-shadow flex flex-col items-center text-center gap-4">
      <div class="w-20 h-20 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
        <span class="material-symbols-outlined text-4xl">pill</span>
      </div>
      <div>
        <h4 class="text-headline-md font-bold text-primary mb-1">Nenhum medicamento cadastrado</h4>
        <p class="text-body-md text-on-surface-variant max-w-sm">Toque no botão <span class="font-bold text-primary">+</span> para adicionar o primeiro medicamento e começar seu acompanhamento.</p>
      </div>
      <button onclick="window.location.href='tela5.html'" class="mt-2 px-6 py-3 bg-primary text-white rounded-xl font-label-md flex items-center gap-2 hover:opacity-90 active:scale-95 transition-all">
        <span class="material-symbols-outlined">add</span>
        Adicionar Medicamento
      </button>
    </div>
  </section>

  <a href="https://www.gov.br/anvisa/pt-br/assuntos/medicamentos" target="_blank" rel="noopener noreferrer" class="mt-8 relative rounded-3xl overflow-hidden h-48 group cursor-pointer block">
    <img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" alt="Farmácia com iluminação em tons roxos" src="pharma.png">
    <div class="absolute inset-0 bg-gradient-to-t from-primary/90 to-transparent flex flex-col justify-end p-4">
      <h4 class="text-white text-headline-md font-bold">Base de Dados Científica</h4>
      <p class="text-white/80 text-body-md">Acesse a Anvisa: bulas, registros e alertas sanitários oficiais.</p>
      <span class="text-white/90 text-label-sm font-bold mt-1 flex items-center gap-1">
        Visitar site oficial <span class="material-symbols-outlined text-sm">open_in_new</span>
      </span>
    </div>
  </a>
</main>

<nav id="bottom-nav" class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-2 pb-safe h-16 bg-surface-container-lowest border-t border-outline-variant shadow-lg rounded-t-xl pb-safe">
  <button data-nav="home" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">home</span><span class="font-label-sm text-[10px]">Início</span>
  </button>
  <button data-nav="meds" class="nav-item nav-active flex flex-1 flex-col items-center justify-center py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">pill</span><span class="font-label-sm text-[10px]">Remédios</span>
  </button>
  <button data-nav="scan" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">document_scanner</span><span class="font-label-sm text-[10px]">Escanear</span>
  </button>
  <button data-nav="alerts" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">notifications</span><span class="font-label-sm text-[10px]">Alertas</span>
  </button>
  <button data-nav="history" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">history_edu</span><span class="font-label-sm text-[10px]">Histórico</span>
  </button>
  <button data-nav="map" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">distance</span><span class="font-label-sm text-[10px]">Mapa</span>
  </button>
</nav>

<button onclick="window.location.href='tela5.html'" class="fixed bottom-24 right-6 w-14 h-14 bg-primary text-white rounded-2xl shadow-xl flex items-center justify-center hover:scale-105 active:scale-95 transition-all z-40">
  <span class="material-symbols-outlined text-3xl">add</span>
</button>

<script>
// CORREÇÃO AQUI: Adicionado a rota 'home' para 'tela11.html'
const navLinks = { 
    home: 'tela11.html', 
    scan: 'tela6.html', 
    alerts: 'tela7.html', 
    history: 'tela10.html', 
    map: 'tela9.html' 
};

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => {
      b.classList.remove('nav-active');
      b.classList.add('text-on-surface-variant');
    });
    btn.classList.add('nav-active');
    btn.classList.remove('text-on-surface-variant');
    const target = navLinks[btn.dataset.nav];
    if (target) window.location.href = target;
  });
});
</script>
</body></html>
