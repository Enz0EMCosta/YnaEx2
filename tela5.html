<!DOCTYPE html>
<html class="light" lang="pt-BR"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>YNA</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: { extend: {
    colors: {
      "error-container":"#ffdad6","on-primary-container":"#d39dd6","on-primary":"#ffffff",
      "surface-container-high":"#eee6ec","primary-container":"#5d3263","outline-variant":"#d0c3cd",
      "error":"#ba1a1a","surface":"#fff7fc","on-error-container":"#93000a",
      "on-surface":"#1e1a1f","secondary-container":"#facffd","on-surface-variant":"#4d444c",
      "surface-container":"#f4ebf2","secondary":"#74537a","surface-container-lowest":"#ffffff",
      "background":"#fff7fc","outline":"#7f747d","primary":"#441b4b"
    },
    spacing: { base:"8px","margin-desktop":"48px","margin-mobile":"16px",gutter:"24px" },
    fontFamily: { "label-sm":["Plus Jakarta Sans"],"headline-md":["Plus Jakarta Sans"],"body-md":["Plus Jakarta Sans"],"label-md":["Plus Jakarta Sans"],"headline-lg-mobile":["Plus Jakarta Sans"] },
    fontSize: {
      "label-sm":["12px",{lineHeight:"16px",fontWeight:"500"}],
      "headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],
      "body-md":["16px",{lineHeight:"24px",fontWeight:"400"}],
      "label-md":["14px",{lineHeight:"20px",letterSpacing:"0.01em",fontWeight:"600"}],
      "headline-lg-mobile":["32px",{lineHeight:"40px",letterSpacing:"-0.02em",fontWeight:"700"}]
    }
  }}
}
</script>
<style>
.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}
.scroll-hide::-webkit-scrollbar{display:none}
.scroll-hide{-ms-overflow-style:none;scrollbar-width:none}
body{min-height:max(884px,100dvh)}
.tonal-shadow{box-shadow:0 10px 25px -8px rgba(68,27,75,0.12)}
.nav-active{background-color:#facffd;color:#77557c}
</style>
</head>
<body class="bg-background min-h-screen pb-40">

<header class="flex justify-between items-center px-margin-mobile h-16 w-full fixed top-0 z-50 bg-surface">
  <div class="flex items-center gap-3">
    <button onclick="window.location.href='tela4.html'" class="p-1 rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
      <span class="material-symbols-outlined text-primary">arrow_back</span>
    </button>
    <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-container flex-shrink-0">
      <img alt="YNA Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAeixioPjNz_N78medxdMHIyJ4jRCPNwRcZcmAP8X8OCBUi1bxS3XXMZntPGLXQ_H2JxhL8Yrr-alFjRNXoUkAYlwUrFueNVfl81SQf9rXF5cvTi3ZeTQs9ixaIEOI_dxZGuPpbiMCR6wVqkCaNXr2P1dKP-hWo6boHfJql-GnOhHBeniS_vbH3Qv64GwS7hrOOnsBChwdqjFukG3e4dmpJS_8AMzUVLfN-tz_t1RHCDIjWKhDhmsNu26lfcLJwV9Mg73wq1jRWi7EA8g">
    </div>
    <h1 class="font-headline-md text-headline-md font-bold text-primary">YNA</h1>
  </div>
  <div class="cursor-pointer active:opacity-80 hover:bg-surface-container-low transition-colors p-2 rounded-full" onclick="window.location.href='tela11.html'">
    <span class="material-symbols-outlined text-on-surface-variant">settings</span>
  </div>
</header>

<main class="pt-20 px-margin-mobile max-w-screen-xl mx-auto">
  <div class="mb-6">
    <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Adicionar Medicamento</h2>
    <p class="text-body-md text-on-surface-variant mt-2">Busque e selecione um ou mais medicamentos para o cadastro.</p>
  </div>

  <section class="space-y-4">
    <div class="relative">
      <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">search</span>
      <input id="med-search" class="w-full pl-12 pr-4 py-4 bg-surface-container-lowest border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all font-body-md text-body-md" placeholder="Pesquisar medicamento..." type="text" autocomplete="off">
    </div>
    <div class="flex gap-2 overflow-x-auto scroll-hide pb-2" id="filter-buttons">
      <button data-filter="nome" class="filter-btn active px-4 py-2 bg-primary-container text-on-primary-container rounded-full font-label-md text-label-md flex items-center gap-2 whitespace-nowrap transition-all active:scale-95">
        <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">medication</span>
        Nome Comercial
      </button>
      <button data-filter="principio" class="filter-btn px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full font-label-md text-label-md flex items-center gap-2 whitespace-nowrap hover:bg-surface-variant transition-all active:scale-95">
        <span class="material-symbols-outlined text-[18px]">biotech</span>
        Princípio Ativo
      </button>
      <button class="px-4 py-2 bg-surface-container-high text-on-surface-variant rounded-full font-label-md text-label-md flex items-center gap-2 whitespace-nowrap hover:bg-surface-variant transition-colors">
        <span class="material-symbols-outlined text-[18px]">filter_list</span>
        Filtros
      </button>
    </div>
  </section>

  <section class="mt-8">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Resultados da Busca</h3>
      <span class="font-label-sm text-label-sm text-outline" id="results-count"></span>
    </div>

    <!-- Estado vazio inicial -->
    <div id="empty-state" class="flex flex-col items-center text-center gap-3 py-10 text-outline">
      <span class="material-symbols-outlined text-5xl">search</span>
      <p class="text-body-md" id="empty-state-text">Digite o nome de um medicamento para começar a busca.</p>
    </div>

    <div class="space-y-3 hidden" id="med-results"></div>
  </section>
</main>

<!-- Medicamentos selecionados -->
<div id="selected-bar" class="fixed bottom-20 left-0 w-full px-margin-mobile z-40 hidden">
  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-3 shadow-lg mb-3">
    <p class="text-label-sm text-outline uppercase tracking-wider mb-2 px-1">Selecionados</p>
    <div class="flex flex-wrap gap-2" id="selected-chips"></div>
  </div>
  <button id="continuar-btn" class="w-full py-4 bg-primary text-white rounded-xl font-headline-md text-headline-md shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-2">
    Continuar
    <span class="material-symbols-outlined">arrow_forward</span>
  </button>
</div>

<!-- FOOTER PADRÃO (Baseado na Tela 4) -->
<nav id="bottom-nav" class="fixed bottom-0 left-0 w-full z-50 flex justify-between items-center px-2 pb-safe h-16 bg-surface-container-lowest border-t border-outline-variant shadow-lg rounded-t-xl pb-safe">
  <button data-nav="home" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">home</span><span class="font-label-sm text-[10px]">Início</span>
  </button>
  <button data-nav="meds" class="nav-item nav-active flex flex-1 flex-col items-center justify-center py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">pill</span><span class="font-label-sm text-[10px]">Remédios</span>
  </button>
  <button data-nav="scan" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">document_scanner</span><span class="font-label-sm text-[10px]">Escanear</span>
  </button>
  <button data-nav="alerts" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">notifications</span><span class="font-label-sm text-[10px]">Alertas</span>
  </button>
  <button data-nav="history" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">history_edu</span><span class="font-label-sm text-[10px]">Histórico</span>
  </button>
  <button data-nav="map" class="nav-item flex flex-1 flex-col items-center justify-center text-on-surface-variant py-1 rounded-lg transition-all active:scale-90">
    <span class="material-symbols-outlined hover:font-variation-settings-['FILL'1]">distance</span><span class="font-label-sm text-[10px]">Mapa</span>
  </button>
</nav>

<script>
const medicamentos = [
  { id: 'hidroclorotiazida', nome: 'Hidroclorotiazida', principio: 'Hidroclorotiazida', icon: 'pill' },
  { id: 'amoxicilina', nome: 'Amoxicilina', principio: 'Amoxicilina', icon: 'vaccines' },
  { id: 'clorana', nome: 'Clorana', principio: 'Furosemida', icon: 'water_drop' },
  { id: 'metformina', nome: 'Metformina', principio: 'Cloridrato de Metformina', icon: 'bloodtype' },
  { id: 'losartana', nome: 'Losartana', principio: 'Losartana Potássica', icon: 'cardiology' },
  { id: 'sinvastatina', nome: 'Sinvastatina', principio: 'Sinvastatina', icon: 'pill' },
  { id: 'omeprazol', nome: 'Omeprazol', principio: 'Omeprazol', icon: 'medication' },
  { id: 'paracetamol', nome: 'Paracetamol', principio: 'Paracetamol', icon: 'pill' },
  { id: 'ibuprofeno', nome: 'Ibuprofeno', principio: 'Ibuprofeno', icon: 'medication' },
  { id: 'captopril', nome: 'Captopril', principio: 'Captopril', icon: 'cardiology' },
];

const searchInput = document.getElementById('med-search');
const emptyState = document.getElementById('empty-state');
const emptyStateText = document.getElementById('empty-state-text');
const resultsContainer = document.getElementById('med-results');
const resultsCount = document.getElementById('results-count');
const selectedBar = document.getElementById('selected-bar');
const selectedChips = document.getElementById('selected-chips');
const filterButtons = document.querySelectorAll('.filter-btn');

const selecionados = new Map();
let currentFilter = 'nome'; // 'nome' ou 'principio'

function renderResults(query) {
  const q = query.trim().toLowerCase();
  if (!q) {
    emptyState.classList.remove('hidden');
    resultsContainer.classList.add('hidden');
    resultsContainer.innerHTML = '';
    resultsCount.textContent = '';
    return;
  }

  const filtrados = medicamentos.filter(m => {
    if (currentFilter === 'principio') {
      return m.principio.toLowerCase().includes(q);
    }
    return m.nome.toLowerCase().includes(q);
  });

  emptyState.classList.add('hidden');
  resultsContainer.classList.remove('hidden');
  resultsCount.textContent = `${filtrados.length} encontrado${filtrados.length !== 1 ? 's' : ''}`;

  if (filtrados.length === 0) {
    resultsContainer.innerHTML = `<p class="text-body-md text-outline text-center py-6">Nenhum medicamento encontrado.</p>`;
    return;
  }

  resultsContainer.innerHTML = filtrados.map(m => {
    const isSelected = selecionados.has(m.id);
    return `
      <div class="med-card p-4 bg-surface-container-lowest border ${isSelected ? 'border-primary' : 'border-outline-variant'} rounded-xl flex items-center justify-between hover:border-primary cursor-pointer transition-all active:scale-[0.98]" data-id="${m.id}">
        <div class="flex items-center gap-4">
          <span class="material-symbols-outlined ${isSelected ? 'text-primary' : 'text-outline-variant'} radio-icon">${isSelected ? 'check_circle' : 'radio_button_unchecked'}</span>
          <div class="w-12 h-12 rounded-lg bg-secondary-container flex items-center justify-center text-on-secondary-container"><span class="material-symbols-outlined">${m.icon}</span></div>
          <div><p class="font-label-sm text-label-sm text-primary font-bold">Princípio: ${m.principio}</p><h4 class="font-label-md text-label-md text-on-surface">${m.nome}</h4></div>
        </div>
      </div>
    `;
  }).join('');

  resultsContainer.querySelectorAll('.med-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = card.dataset.id;
      toggleSelecionado(id);
      renderResults(searchInput.value);
    });
  });
}

function toggleSelecionado(id) {
  const med = medicamentos.find(m => m.id === id);
  if (selecionados.has(id)) {
    selecionados.delete(id);
  } else {
    selecionados.set(id, med);
  }
  renderSelectedChips();
}

function renderSelectedChips() {
  if (selecionados.size === 0) {
    selectedBar.classList.add('hidden');
    selectedChips.innerHTML = '';
    return;
  }
  selectedBar.classList.remove('hidden');
  selectedChips.innerHTML = Array.from(selecionados.values()).map(m => `
    <span class="bg-primary-container text-on-primary-container font-label-md py-2 px-4 rounded-full flex items-center gap-2">
      <span class="material-symbols-outlined text-[18px]">${m.icon}</span>
      ${m.nome}
      <span class="material-symbols-outlined text-sm cursor-pointer remove-chip" data-id="${m.id}">close</span>
    </span>
  `).join('');

  selectedChips.querySelectorAll('.remove-chip').forEach(btn => {
    btn.addEventListener('click', () => {
      toggleSelecionado(btn.dataset.id);
      renderResults(searchInput.value);
    });
  });
}

/* ===== Filtro Nome Comercial / Princípio Ativo ===== */
filterButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    filterButtons.forEach(b => {
      b.classList.remove('active', 'bg-primary-container', 'text-on-primary-container');
      b.classList.add('bg-surface-container-high', 'text-on-surface-variant');
    });
    btn.classList.add('active', 'bg-primary-container', 'text-on-primary-container');
    btn.classList.remove('bg-surface-container-high', 'text-on-surface-variant');

    currentFilter = btn.dataset.filter;
    emptyStateText.textContent = currentFilter === 'principio'
      ? 'Digite o princípio ativo para começar a busca.'
      : 'Digite o nome de um medicamento para começar a busca.';
    searchInput.placeholder = currentFilter === 'principio'
      ? 'Pesquisar por princípio ativo...'
      : 'Pesquisar medicamento...';

    if (searchInput.value.trim()) {
      renderResults(searchInput.value);
    }
  });
});

searchInput.addEventListener('input', () => renderResults(searchInput.value));

document.getElementById('continuar-btn').addEventListener('click', () => {
  if (selecionados.size === 0) return;
  window.location.href = 'tela7.html';
});

/* ===== SCRIPT DE NAVEGAÇÃO PADRÃO ===== */
const navLinks = { 
    home: 'tela11.html', 
    meds: 'tela4.html', 
    scan: 'tela6.html', 
    alerts: 'tela7.html', 
    history: 'tela10.html', 
    map: 'tela9.html' 
};

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => {
      b.classList.remove('nav-active');
      b.classList.add('text-on-surface-variant');
    });
    btn.classList.add('nav-active');
    btn.classList.remove('text-on-surface-variant');
    
    const target = navLinks[btn.dataset.nav];
    if (target) window.location.href = target;
  });
});
</script>
</body></html>
